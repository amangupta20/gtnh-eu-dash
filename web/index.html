<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a0f16" id="themecolor">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0f16'/%3E%3Cpath d='M36 6 14 36h12l-4 22 24-32H33z' fill='%23facc15'/%3E%3C/svg%3E">
<title>⚡ Wireless EU</title>
<style>
  :root, [data-theme="dark"] {
    --bg:#0a0f16; --card:#111826; --line:#1f2a3d; --txt:#e8edf5; --dim:#8b96ab;
    --up:#34d399; --down:#f87171; --acc:#22d3ee; --gold:#facc15;
    --hero1:#141c2c; --hero2:#0f1522; --chartline:#22d3ee;
  }
  [data-theme="light"] {
    --bg:#eef1f6; --card:#ffffff; --line:#dbe2ec; --txt:#0f172a; --dim:#64748b;
    --up:#059669; --down:#dc2626; --acc:#0284c7; --gold:#a16207;
    --hero1:#ffffff; --hero2:#f1f5f9; --chartline:#0284c7;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt);
         font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         font-variant-numeric:tabular-nums; padding:14px; max-width:900px; margin:0 auto; }
  .top { display:flex; justify-content:flex-end; margin-bottom:8px; }
  .top button { background:var(--card); color:var(--dim); border:1px solid var(--line);
                border-radius:999px; padding:6px 14px; font:inherit; font-size:12px; cursor:pointer; }
  .hero { background:linear-gradient(180deg,var(--hero1),var(--hero2)); border:1px solid var(--line);
          border-radius:16px; padding:18px 20px 14px; box-shadow:0 8px 28px rgba(0,0,0,.18); }
  .label { color:var(--dim); font-size:12px; letter-spacing:2px; text-transform:uppercase;
           display:flex; align-items:center; gap:8px; }
  .live { font-size:11px; letter-spacing:1px; padding:2px 10px; border-radius:999px;
          border:1px solid var(--line); }
  .live.on { color:var(--up); border-color:var(--up); animation:pulse 2s infinite; }
  .live.stale { color:var(--gold); border-color:var(--gold); }
  .live.nodata { color:var(--dim); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }
  .big { font-size:clamp(32px,7.5vw,54px); font-weight:800; margin:8px 0 2px;
         word-break:break-all; color:var(--txt); }
  .big small { font-size:.42em; color:var(--dim); font-weight:400; }
  .sub { color:var(--dim); font-size:13px; }
  .row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .pill { flex:1 1 140px; background:var(--card); border:1px solid var(--line);
          border-top:3px solid var(--line); border-radius:10px; padding:8px 12px;
          font-size:12px; color:var(--dim); }
  .pill b { display:block; font-size:17px; margin-top:2px; color:var(--txt); }
  .pill b.up { color:var(--up); } .pill b.down { color:var(--down); }
  .pill.pos { border-top-color:var(--up); } .pill.neg { border-top-color:var(--down); }
  .up { color:var(--up); } .down { color:var(--down); }
  .wins { display:flex; gap:8px; margin:14px 0 10px; flex-wrap:wrap; }
  .wins button { background:var(--card); color:var(--dim); border:1px solid var(--line);
                 border-radius:999px; padding:7px 16px; font:inherit; font-size:13px; cursor:pointer; }
  .wins button.on { color:var(--txt); border-color:var(--acc); font-weight:700; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:12px; margin-top:10px; box-shadow:0 8px 28px rgba(0,0,0,.12); }
  #chart { width:100%; height:340px; }
  .legend { font-size:12px; color:var(--dim); padding:2px 4px 0; }
  .legend i { display:inline-block; width:18px; height:3px; background:var(--acc);
              border-radius:2px; vertical-align:middle; margin-right:6px; }
  .stats { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; font-size:12px; color:var(--dim); }
  .stats div { flex:1 1 120px; } .stats b { color:var(--txt); display:block; font-size:14px; margin-top:2px; }
  .foot { color:var(--dim); font-size:12px; margin-top:12px; text-align:right; }
  .err { color:var(--down); font-size:13px; margin-top:8px; display:none; }
</style>
</head>
<body>
  <div class="top"><button id="theme">☀ light mode</button></div>
  <div class="hero">
    <div class="label">⚡ Wireless EU network <span id="live" class="live nodata">● NO DATA</span></div>
    <div class="big" id="big">—</div>
    <div class="sub" id="exact">waiting for first sample…</div>
    <div class="row">
      <div class="pill" id="p5">EU/t · 5m<b id="eut5">—</b></div>
      <div class="pill" id="p1">EU/t · 1h<b id="eut1">—</b></div>
      <div class="pill" id="p24">EU/t · 24h<b id="eut24">—</b></div>
    </div>
    <div class="err" id="err"></div>
  </div>
  <div class="wins" id="wins">
    <button data-w="5m">5m</button><button data-w="1h">1h</button>
    <button data-w="24h" class="on">24h</button><button data-w="7d">7d</button>
    <button data-w="30d">30d</button>
  </div>
  <div class="card">
    <div class="legend"><i></i>stored EU · dot = latest sample</div>
    <div id="chart"></div>
  </div>
  <div class="card"><div class="stats">
    <div>Window min<b id="smin">—</b></div>
    <div>Window max<b id="smax">—</b></div>
    <div>Net change<b id="snet">—</b></div>
    <div>Samples<b id="scnt">—</b></div>
  </div></div>
  <div class="foot" id="upd"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script>
"use strict";
// Exact display from digit strings (JS Numbers die past 2^53).
function commas(s){ return s.replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function metric(s){
  s = String(s).replace(/^0+/, "") || "0";
  if (s.length <= 4) return commas(s);
  const SUF = ["k","M","G","T","P","E","Z","Y"];
  const exp = s.length - 1, t = Math.floor(exp / 3) - 1;
  const suf = SUF[t] || ("e" + exp);
  const cut = s.length - (t + 1) * 3;
  let m = s.slice(0, cut) + "." + (s.slice(cut, cut + 2) || "0");
  m = m.replace(/\.?0+$/, "");
  return m + suf;
}
function rate(s){
  if (s == null) return ["—", "", ""];
  const a = Math.abs(s);
  const f = a >= 1e9 ? (s/1e9).toFixed(2)+"G" : a >= 1e6 ? (s/1e6).toFixed(2)+"M"
        : a >= 1e3 ? (s/1e3).toFixed(1)+"k" : s.toFixed(s !== 0 && a < 10 ? 1 : 0);
  const sign = s > 0 ? "▲ +" : s < 0 ? "▼ −" : "";
  return [sign + f + " EU/t", s > 0 ? "up" : s < 0 ? "down" : "", s > 0 ? "pos" : s < 0 ? "neg" : ""];
}
function age(s){
  if (s == null) return "";
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}
// --- theme (persisted) ---
const root = document.documentElement, themeBtn = document.getElementById("theme");
function css(v){ return getComputedStyle(root).getPropertyValue(v).trim(); }
function applyTheme(t){
  root.dataset.theme = t;
  document.getElementById("themecolor").content = t === "light" ? "#eef1f6" : "#0a0f16";
  themeBtn.textContent = t === "light" ? "🌙 dark mode" : "☀ light mode";
  localStorage.setItem("eu-theme", t);
  paintChart();
}
themeBtn.addEventListener("click", () =>
  applyTheme(root.dataset.theme === "light" ? "dark" : "light"));
let win = localStorage.getItem("eu-win") || "24h";
const chart = echarts.init(document.getElementById("chart"));
function paintChart(){
  const line = css("--chartline") || "#22d3ee", dim = css("--dim") || "#8b96ab",
        grid = root.dataset.theme === "light" ? "#e6ebf2" : "#161c29";
  chart.setOption({
    backgroundColor: "transparent",
    grid: { left: 8, right: 64, top: 24, bottom: 24, containLabel: true },
    tooltip: { trigger: "axis",
      formatter: p => new Date(p[0].value[0]*1000).toLocaleString() + "<br/>" + metric(String(Math.round(p[0].value[1]))) + " EU" },
    xAxis: { type: "time", axisLine: { lineStyle: { color: grid } }, axisLabel: { color: dim, fontSize: 11 } },
    yAxis: { type: "value", scale: true, splitLine: { lineStyle: { color: grid } },
      axisLabel: { color: dim, fontSize: 11, formatter: v => metric(String(Math.round(v))) } },
    series: [{ type: "line", showSymbol: false, smooth: 0.15, connectNulls: false,
      lineStyle: { width: 2.5, color: line },
      areaStyle: { opacity: root.dataset.theme === "light" ? 0.18 : 0.35, color: line },
      markPoint: { silent: true, symbol: "circle", symbolSize: 9,
        itemStyle: { color: line, borderColor: "#fff", borderWidth: 2 },
        label: { color: dim, fontSize: 11, position: "right", distance: 8,
          formatter: p => metric(String(Math.round(p.value))) + " EU" },
        data: [{ type: "max", name: "latest", coord: null }] } }],
    dataZoom: [{ type: "inside" }],
  }, true);
  refresh();
}
let lastPts = [];
function setData(pts){
  lastPts = pts;
  const end = pts[pts.length-1];
  chart.setOption({ series: [{ data: pts,
    markPoint: { data: [{ name: "latest", coord: end, value: end[1] }] } }] });
}
window.addEventListener("resize", () => chart.resize());
document.getElementById("wins").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  win = b.dataset.w; localStorage.setItem("eu-win", win);
  document.querySelectorAll("#wins button").forEach(x => x.classList.toggle("on", x === b));
  refresh();
});
document.querySelectorAll("#wins button").forEach(x => x.classList.toggle("on", x.dataset.w === win));
async function jget(p){
  const r = await fetch(p);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function setRate(id, pid, v){
  const [t, c, pc] = rate(v), el = document.getElementById(id);
  el.textContent = t; el.className = c;
  document.getElementById(pid).className = "pill" + (pc ? " " + pc : "");
}
async function refresh(){
  const err = document.getElementById("err");
  try {
    const [cur, ser] = await Promise.all([
      jget("/api/current"), jget("/api/series?window=" + win + "&points=400")]);
    err.style.display = "none";
    const live = document.getElementById("live");
    if (cur.eu == null) { live.textContent = "● NO DATA"; live.className = "live nodata"; }
    else if (cur.stale) { live.textContent = "● STALE · " + age(cur.age_s); live.className = "live stale"; }
    else { live.textContent = "● LIVE"; live.className = "live on"; }
    if (cur.eu != null) {
      document.getElementById("big").innerHTML = metric(cur.eu) + " <small>EU</small>";
      document.getElementById("exact").textContent = commas(cur.eu) + " EU";
      setRate("eut5", "p5", cur.eut_5m); setRate("eut1", "p1", cur.eut_1h); setRate("eut24", "p24", cur.eut_24h);
      document.getElementById("upd").textContent =
        "sample " + new Date(cur.ts * 1000).toLocaleString();
    }
    if (ser.points.length) {
      setData(ser.points.map(p => [p[0]*1000, p[1]]));
      document.getElementById("smin").textContent = metric(String(Math.round(ser.min))) + " EU";
      document.getElementById("smax").textContent = metric(String(Math.round(ser.max))) + " EU";
      const d = ser.points[ser.points.length-1][1] - ser.points[0][1];
      const span = Math.max(1, ser.points[ser.points.length-1][0] - ser.points[0][0]);
      const [t, c] = rate(d / span);
      const net = document.getElementById("snet");
      net.textContent = (d >= 0 ? "▲ +" : "▼ −") + metric(String(Math.round(Math.abs(d)))) + " EU (" + t + ")";
      net.className = c;
      document.getElementById("scnt").textContent = ser.points.length + " buckets";
    }
  } catch (e) { err.textContent = "refresh failed: " + e.message; err.style.display = "block"; }
}
applyTheme(localStorage.getItem("eu-theme") || "dark");
setInterval(refresh, 10000);
</script>
</body>
</html>
